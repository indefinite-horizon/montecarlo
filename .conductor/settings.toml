"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

file_include_globs = ".env*.local"

[[preview_urls]]
name = "web"
url = "http://localhost:$CONDUCTOR_PORT"

[prompts]
create_pr = "Follow /babysit skill after"

[scripts]
setup = "bash scripts/setup_worktree.sh"
run_mode = "concurrent"

[scripts.run.dev]
available_in = [ "local" ]
command = "bash scripts/run_local.sh"
default = true
icon = "play"

[scripts.run.test]
command = "bun run test"
icon = "test-tube"

[scripts.run.check]
command = "bun run lint && bun run typecheck"
icon = "circle-check"
