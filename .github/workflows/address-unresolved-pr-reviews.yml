name: Address Unresolved PR Reviews

on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

jobs:
  report:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    permissions:
      pull-requests: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo "Use the address-unresolved-pr-reviews skill to triage open review threads."
