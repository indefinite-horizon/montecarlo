name: Nightly E2E

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6
      - run: bun install
      - run: bunx playwright install --with-deps chromium
      - run: bash scripts/prepare_e2e_env.sh .env.example .env.e2e
      - run: PLAYWRIGHT_WORKERS=2 bun run test:e2e:nightly:ci
