name: Desktop Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release-macos:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 60
    env:
      UPDATE_REPOSITORY: indefinite-horizon/montecarlo-releases
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check release credentials
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASE_TOKEN }}
          CSC_LINK: ${{ secrets.DESKTOP_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.DESKTOP_APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          for variable in \
            GH_TOKEN \
            CSC_LINK \
            CSC_KEY_PASSWORD \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER \
            APPLE_API_KEY_P8_BASE64
          do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Missing required desktop release secret for ${variable}"
              exit 1
            fi
          done

      - name: Require a public update repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          visibility="$(gh repo view "$UPDATE_REPOSITORY" --json visibility --jq .visibility)"
          if [[ "$visibility" != "PUBLIC" ]]; then
            echo "::error::OTA updates require $UPDATE_REPOSITORY to be public; it is $visibility"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Select a monotonic release version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          latest_tag="$(gh release view --repo "$UPDATE_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          version_arguments=(--run-number "$GITHUB_RUN_NUMBER")
          if [[ -n "$latest_tag" ]]; then
            version_arguments+=(--latest-tag "$latest_tag")
          fi
          version="$(bun scripts/desktop_release_version.mjs "${version_arguments[@]}")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Enforce direct-update compatibility
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASE_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p .context/desktop-release
          latest_tag="$(gh release view --repo "$UPDATE_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          previous_arguments=()
          if [[ -n "$latest_tag" ]]; then
            gh release download "$latest_tag" \
              --repo "$UPDATE_REPOSITORY" \
              --pattern desktop-release-compatibility.json \
              --dir .context/desktop-release/previous
            previous_arguments=(--previous .context/desktop-release/previous/desktop-release-compatibility.json)
          fi
          bun scripts/check_desktop_release_compatibility.mjs \
            --version "$RELEASE_VERSION" \
            "${previous_arguments[@]}" \
            --output .context/desktop-release/desktop-release-compatibility.json

      - name: Configure Apple notarization
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.DESKTOP_APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and upload a draft
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASE_TOKEN }}
          CSC_LINK: ${{ secrets.DESKTOP_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: >-
          bun run --filter './apps/desktop' build:release:mac --
          --config.extraMetadata.version="$RELEASE_VERSION"
          --config.forceCodeSigning=true

      - name: Remove notarization private key
        if: always()
        shell: bash
        run: rm -f "${APPLE_API_KEY:-$RUNNER_TEMP/missing-notarization-key}"

      - name: Verify signed and notarized artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          app_path="$(find dist/desktop -type d -iname 'montecarlo.app' -print -quit)"
          dmg_path="dist/desktop/Monte-Carlo-${RELEASE_VERSION}-universal.dmg"
          if [[ -z "$app_path" || ! -f "$dmg_path" ]]; then
            echo "::error::The universal app or DMG is missing"
            exit 1
          fi
          bundle_identifier="$(defaults read "$app_path/Contents/Info" CFBundleIdentifier)"
          if [[ "$bundle_identifier" != "chat.montecarlo.desktop" ]]; then
            echo "::error::Unexpected bundle identifier: $bundle_identifier"
            exit 1
          fi
          architectures="$(lipo -archs "$app_path/Contents/MacOS/montecarlo")"
          if [[ "$architectures" != *arm64* || "$architectures" != *x86_64* ]]; then
            echo "::error::Expected a universal app, found architectures: $architectures"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --verify --verbose=2 "$dmg_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg_path"
          xcrun stapler validate "$app_path"
          signing_team_id="$(codesign -d --verbose=4 "$app_path" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          if [[ -z "$signing_team_id" || "$signing_team_id" == "not set" ]]; then
            echo "::error::The release is not signed by an Apple Developer ID team"
            exit 1
          fi
          previous_arguments=()
          if [[ -f .context/desktop-release/previous/desktop-release-compatibility.json ]]; then
            previous_arguments=(--previous .context/desktop-release/previous/desktop-release-compatibility.json)
          fi
          bun scripts/check_desktop_release_compatibility.mjs \
            --version "$RELEASE_VERSION" \
            "${previous_arguments[@]}" \
            --signing-team-id "$signing_team_id" \
            --output .context/desktop-release/desktop-release-compatibility.json
          bun scripts/verify_desktop_release_artifacts.mjs \
            --version "$RELEASE_VERSION" \
            --directory dist/desktop

      - name: Smoke test the self-contained packaged app
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find dist/desktop -type d -iname 'montecarlo.app' -print -quit)"
          bash scripts/smoke_packaged_desktop.sh "$app_path"

      - name: Publish verified OTA release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASE_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          is_draft="$(gh release view "$RELEASE_TAG" \
            --repo "$UPDATE_REPOSITORY" \
            --json isDraft \
            --jq .isDraft)"
          if [[ "$is_draft" != "true" ]]; then
            echo "::error::Expected electron-builder to upload an invisible draft release"
            exit 1
          fi
          uploaded_assets="$(gh release view "$RELEASE_TAG" \
            --repo "$UPDATE_REPOSITORY" \
            --json assets \
            --jq '.assets[].name')"
          for required_asset in \
            "Monte-Carlo-${RELEASE_VERSION}-universal.dmg" \
            "Monte-Carlo-${RELEASE_VERSION}-universal.zip" \
            latest-mac.yml
          do
            if ! grep -Fxq "$required_asset" <<< "$uploaded_assets"; then
              echo "::error::Draft release is missing $required_asset"
              exit 1
            fi
          done
          gh release upload "$RELEASE_TAG" \
            .context/desktop-release/desktop-release-compatibility.json \
            --repo "$UPDATE_REPOSITORY" \
            --clobber
          printf 'Monte Carlo %s\n\nSource revision: `%s`\n' \
            "$RELEASE_VERSION" "$SOURCE_SHA" \
            > .context/desktop-release/release-notes.md
          gh release edit "$RELEASE_TAG" \
            --repo "$UPDATE_REPOSITORY" \
            --title "Monte Carlo ${RELEASE_VERSION}" \
            --notes-file .context/desktop-release/release-notes.md \
            --draft=false \
            --latest
