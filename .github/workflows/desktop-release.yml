name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact main commit created by the merged release PR
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release-macos:
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: desktop-release
    permissions:
      contents: write
    # Pin the release and smoke builds to the same Blacksmith macOS image. The
    # M4 host still produces and verifies both slices of the universal app.
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 60
    env:
      UPDATE_REPOSITORY: ${{ github.repository }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - name: Require an exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be the full lowercase SHA of the merged release PR"
            exit 1
          fi

      - name: Check release credentials
        shell: bash
        env:
          CSC_LINK_P12_BASE64: ${{ secrets.DESKTOP_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.DESKTOP_APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          for variable in \
            CSC_LINK_P12_BASE64 \
            CSC_KEY_PASSWORD \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER \
            APPLE_API_KEY_P8_BASE64
          do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Missing required desktop release secret for ${variable}"
              exit 1
            fi
          done
          if [[ ! "$APPLE_API_ISSUER" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::DESKTOP_APPLE_API_ISSUER must be a UUID"
            exit 1
          fi

      - name: Require this public repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          visibility="$(gh repo view "$UPDATE_REPOSITORY" --json visibility --jq .visibility)"
          if [[ "$visibility" != "PUBLIC" ]]; then
            echo "::error::Anonymous OTA updates require $UPDATE_REPOSITORY to be public; it is $visibility"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the source commit on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
            echo "::error::source_sha is not reachable from main"
            exit 1
          fi
          if ! git rev-list --first-parent origin/main | grep -Fx "$SOURCE_SHA" >/dev/null; then
            echo "::error::source_sha must be a merge or squash commit on main's first-parent history"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate the source and prepare the release draft
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(bun scripts/release_version.mjs current)"
          tag="v${version}"
          bun scripts/release_notes.mjs validate --version "$version"
          release_title="$(bun scripts/release_notes.mjs title --version "$version")"
          mkdir -p .context/desktop-release
          bun scripts/release_notes.mjs body \
            --version "$version" \
            --output .context/desktop-release/release-notes.md

          parent_sha="$(git rev-parse "${SOURCE_SHA}^")"
          parent_version="$(git show "${parent_sha}:package.json" \
            | node -e 'const fs = require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(0, "utf8")).version)')"
          bun scripts/release_version.mjs assert-newer "$version" "$parent_version"
          {
            bun scripts/release_version.mjs paths
            printf '%s\n' "docs/releases/${tag}.md"
            if ! git diff --quiet "$parent_sha" "$SOURCE_SHA" -- bun.lock; then
              printf '%s\n' bun.lock
            fi
          } | sort > .context/desktop-release/expected-source-files.txt
          git diff --name-only "$parent_sha" "$SOURCE_SHA" \
            | sort > .context/desktop-release/actual-source-files.txt
          if ! cmp -s \
            .context/desktop-release/expected-source-files.txt \
            .context/desktop-release/actual-source-files.txt
          then
            echo "::error::source_sha must be the isolated merged release commit"
            diff -u \
              .context/desktop-release/expected-source-files.txt \
              .context/desktop-release/actual-source-files.txt || true
            exit 1
          fi

          gh api \
            --paginate \
            "repos/${UPDATE_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            > .context/desktop-release/published-tags.txt
          previous_tag="$(bun scripts/release_version.mjs highest-tag \
            < .context/desktop-release/published-tags.txt)"
          if [[ -n "$previous_tag" ]]; then
            bun scripts/release_version.mjs assert-newer "$version" "${previous_tag#v}"
          fi

          tag_ref_json="$(gh api "repos/${UPDATE_REPOSITORY}/git/matching-refs/tags/${tag}")"
          tag_ref_count="$(jq --arg ref "refs/tags/${tag}" \
            '[.[] | select(.ref == $ref)] | length' <<< "$tag_ref_json")"
          if [[ "$tag_ref_count" -gt 1 ]]; then
            echo "::error::Multiple exact refs unexpectedly matched ${tag}"
            exit 1
          fi
          if [[ "$tag_ref_count" -eq 1 ]]; then
            existing_tag_sha="$(gh api "repos/${UPDATE_REPOSITORY}/commits/${tag}" --jq .sha)"
            if [[ "$existing_tag_sha" != "$SOURCE_SHA" ]]; then
              echo "::error::Existing ${tag} does not point to the exact source SHA"
              exit 1
            fi
          else
            jq -n \
              --arg ref "refs/tags/${tag}" \
              --arg sha "$SOURCE_SHA" \
              '{ref: $ref, sha: $sha}' \
              | gh api \
                  --method POST \
                  "repos/${UPDATE_REPOSITORY}/git/refs" \
                  --input - \
                  > .context/desktop-release/tag-ref.json
          fi
          tag_commit_sha="$(gh api "repos/${UPDATE_REPOSITORY}/commits/${tag}" --jq .sha)"
          if [[ "$tag_commit_sha" != "$SOURCE_SHA" ]]; then
            echo "::error::${tag} does not resolve to the exact source SHA"
            exit 1
          fi

          gh api \
            --paginate \
            "repos/${UPDATE_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.draft == true and .tag_name == \"${tag}\") | .id" \
            > .context/desktop-release/draft-ids.txt
          draft_count="$(awk 'NF { count += 1 } END { print count + 0 }' \
            .context/desktop-release/draft-ids.txt)"
          if [[ "$draft_count" -gt 1 ]]; then
            echo "::error::Expected at most one Actions-owned ${tag} draft; found ${draft_count}"
            exit 1
          fi
          if [[ "$draft_count" -eq 0 ]]; then
            jq -n \
              --arg tag "$tag" \
              --arg name "$release_title" \
              --rawfile body .context/desktop-release/release-notes.md \
              '{tag_name: $tag, name: $name, body: $body, draft: true, prerelease: false}' \
              | gh api \
                  --method POST \
                  "repos/${UPDATE_REPOSITORY}/releases" \
                  --input - \
                  > .context/desktop-release/created-draft.json
            release_id="$(jq -r .id .context/desktop-release/created-draft.json)"
          else
            release_id="$(sed -n '1p' .context/desktop-release/draft-ids.txt)"
          fi
          release_json="$(gh api "repos/${UPDATE_REPOSITORY}/releases/${release_id}")"
          if [[ "$(jq -r .draft <<< "$release_json")" != "true" ]]; then
            echo "::error::${tag} already exists as a published release"
            exit 1
          fi
          if [[ "$(jq -r .prerelease <<< "$release_json")" != "false" ]]; then
            echo "::error::${tag} must be a stable release draft"
            exit 1
          fi
          if [[ "$(jq -r .tag_name <<< "$release_json")" != "$tag" ]]; then
            echo "::error::Release lookup returned the wrong tag"
            exit 1
          fi
          jq -n \
            --arg tag "$tag" \
            --arg name "$release_title" \
            --rawfile body .context/desktop-release/release-notes.md \
            '{tag_name: $tag, name: $name, body: $body, draft: true, prerelease: false}' \
            | gh api \
                --method PATCH \
                "repos/${UPDATE_REPOSITORY}/releases/${release_id}" \
                --input - \
                > .context/desktop-release/draft.json
          if [[ "$(jq -r .tag_name .context/desktop-release/draft.json)" != "$tag" ]]; then
            echo "::error::Refreshing the release draft changed its tag association"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Enforce direct-update compatibility
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RELEASE_TAG: ${{ steps.release.outputs.previous_tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          compatibility_arguments=(--version "$RELEASE_VERSION")
          if [[ -n "$PREVIOUS_RELEASE_TAG" ]]; then
            gh release download "$PREVIOUS_RELEASE_TAG" \
              --repo "$UPDATE_REPOSITORY" \
              --pattern desktop-release-compatibility.json \
              --dir .context/desktop-release/previous
            compatibility_arguments+=(
              --previous .context/desktop-release/previous/desktop-release-compatibility.json
            )
          fi
          compatibility_arguments+=(
            --output .context/desktop-release/desktop-release-compatibility.json
          )
          bun scripts/check_desktop_release_compatibility.mjs \
            "${compatibility_arguments[@]}"

      - name: Configure Apple notarization
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.DESKTOP_APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Validate Apple notarization credentials
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          xcrun notarytool history \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --output-format json >/dev/null

      - name: Configure Apple signing certificate
        shell: bash
        env:
          CSC_LINK_P12_BASE64: ${{ secrets.DESKTOP_CSC_LINK }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/desktop-signing.p12"
          printf '%s' "$CSC_LINK_P12_BASE64" | base64 -D > "$certificate_path"
          if [[ ! -s "$certificate_path" ]]; then
            echo "::error::DESKTOP_CSC_LINK did not decode to a signing certificate"
            exit 1
          fi
          chmod 600 "$certificate_path"
          echo "CSC_LINK=$certificate_path" >> "$GITHUB_ENV"

      - name: Build, sign, and notarize the app once
        env:
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER }}
        run: >-
          bun run --filter './apps/desktop' build:release:mac --
          --config.forceCodeSigning=true

      - name: Notarize and staple the signed DMG
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          dmg_path="dist/desktop/Monte-Carlo-${RELEASE_VERSION}-universal.dmg"
          xcrun notarytool submit "$dmg_path" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg_path"

      - name: Refresh updater metadata for the stapled DMG
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          refresh_script="$RUNNER_TEMP/refresh_desktop_release_dmg_metadata.mjs"
          git show "${WORKFLOW_SHA}:scripts/refresh_desktop_release_dmg_metadata.mjs" \
            > "$refresh_script"
          bun "$refresh_script" \
            --version "$RELEASE_VERSION" \
            --directory dist/desktop

      - name: Remove signing secrets
        if: always()
        shell: bash
        run: |
          rm -f \
            "${APPLE_API_KEY:-$RUNNER_TEMP/missing-notarization-key}" \
            "${CSC_LINK:-$RUNNER_TEMP/missing-signing-certificate}"

      - name: Verify signed, notarized, and hashed artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          app_path="$(find dist/desktop -type d -iname 'montecarlo.app' -print -quit)"
          dmg_path="dist/desktop/Monte-Carlo-${RELEASE_VERSION}-universal.dmg"
          if [[ -z "$app_path" || ! -f "$dmg_path" ]]; then
            echo "::error::The universal app or DMG is missing"
            exit 1
          fi
          bundle_identifier="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Contents/Info.plist")"
          if [[ "$bundle_identifier" != "chat.montecarlo.desktop" ]]; then
            echo "::error::Unexpected bundle identifier: $bundle_identifier"
            exit 1
          fi
          architectures="$(lipo -archs "$app_path/Contents/MacOS/montecarlo")"
          if [[ "$architectures" != *arm64* || "$architectures" != *x86_64* ]]; then
            echo "::error::Expected a universal app, found architectures: $architectures"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --verify --verbose=2 "$dmg_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg_path"
          xcrun stapler validate "$app_path"
          xcrun stapler validate "$dmg_path"
          signing_team_id="$(codesign -d --verbose=4 "$app_path" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          if [[ -z "$signing_team_id" || "$signing_team_id" == "not set" ]]; then
            echo "::error::The release is not signed by an Apple Developer ID team"
            exit 1
          fi
          compatibility_arguments=(
            --version "$RELEASE_VERSION"
            --signing-team-id "$signing_team_id"
          )
          if [[ -f .context/desktop-release/previous/desktop-release-compatibility.json ]]; then
            compatibility_arguments+=(
              --previous .context/desktop-release/previous/desktop-release-compatibility.json
            )
          fi
          compatibility_arguments+=(
            --output .context/desktop-release/desktop-release-compatibility.json
          )
          bun scripts/check_desktop_release_compatibility.mjs \
            "${compatibility_arguments[@]}"
          bun scripts/verify_desktop_release_artifacts.mjs \
            --version "$RELEASE_VERSION" \
            --directory dist/desktop

      - name: Load the release smoke harness from the workflow revision
        shell: bash
        run: |
          set -euo pipefail
          git show "${WORKFLOW_SHA}:scripts/smoke_packaged_desktop.sh" \
            > scripts/smoke_packaged_desktop.sh
          git show "${WORKFLOW_SHA}:tests/e2e/desktop/shell.spec.ts" \
            > tests/e2e/desktop/shell.spec.ts

      - name: Smoke test the self-contained packaged app
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find dist/desktop -type d -iname 'montecarlo.app' -print -quit)"
          bash scripts/smoke_packaged_desktop.sh "$app_path"

      - name: Upload the verified DMG and OTA feed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${UPDATE_REPOSITORY}/releases/${RELEASE_ID}")"
          if [[ "$(jq -r .draft <<< "$release_json")" != "true" ]]; then
            echo "::error::The release stopped being a draft before asset upload"
            exit 1
          fi
          if [[ "$(jq -r .prerelease <<< "$release_json")" != "false" ]]; then
            echo "::error::The release draft became a prerelease"
            exit 1
          fi
          tag_ref_json="$(gh api "repos/${UPDATE_REPOSITORY}/git/matching-refs/tags/${RELEASE_TAG}")"
          tag_ref_count="$(jq --arg ref "refs/tags/${RELEASE_TAG}" \
            '[.[] | select(.ref == $ref)] | length' <<< "$tag_ref_json")"
          if [[ "$tag_ref_count" -ne 1 ]]; then
            echo "::error::The exact ${RELEASE_TAG} ref is missing before asset upload"
            exit 1
          fi
          tag_commit_sha="$(gh api \
            "repos/${UPDATE_REPOSITORY}/commits/${RELEASE_TAG}" \
            --jq .sha)"
          if [[ "$tag_commit_sha" != "$SOURCE_SHA" ]]; then
            echo "::error::${RELEASE_TAG} moved away from the source SHA before asset upload"
            exit 1
          fi
          expected_title="$(bun scripts/release_notes.mjs title --version "$RELEASE_VERSION")"
          if [[ "$(jq -r .name <<< "$release_json")" != "$expected_title" ]]; then
            echo "::error::The release title no longer matches the committed notes"
            exit 1
          fi
          jq -j .body <<< "$release_json" > .context/desktop-release/remote-notes.md
          if ! cmp -s \
            .context/desktop-release/release-notes.md \
            .context/desktop-release/remote-notes.md
          then
            echo "::error::The release body no longer matches the committed notes"
            exit 1
          fi

          release_asset_paths=(
            "dist/desktop/Monte-Carlo-${RELEASE_VERSION}-universal.dmg"
            "dist/desktop/Monte-Carlo-${RELEASE_VERSION}-universal.dmg.blockmap"
            "dist/desktop/Monte-Carlo-${RELEASE_VERSION}-universal.zip"
            "dist/desktop/Monte-Carlo-${RELEASE_VERSION}-universal.zip.blockmap"
            dist/desktop/latest-mac.yml
            .context/desktop-release/desktop-release-compatibility.json
          )
          for asset_path in "${release_asset_paths[@]}"; do
            asset_name="$(basename "$asset_path")"
            while IFS= read -r existing_asset_id; do
              if [[ -n "$existing_asset_id" ]]; then
                gh api --method DELETE \
                  "repos/${UPDATE_REPOSITORY}/releases/assets/${existing_asset_id}"
              fi
            done < <(
              jq -r --arg name "$asset_name" \
                '.assets[] | select(.name == $name) | .id' \
                <<< "$release_json"
            )
            gh api \
              --method POST \
              -H 'Content-Type: application/octet-stream' \
              --input "$asset_path" \
              "https://uploads.github.com/repos/${UPDATE_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${asset_name}" \
              >/dev/null
          done

          for asset_path in "${release_asset_paths[@]}"; do
            asset_name="$(basename "$asset_path")"
            asset_size="$(wc -c < "$asset_path" | tr -d '[:space:]')"
            printf '%s\t%s\tuploaded\n' "$asset_name" "$asset_size"
          done | sort > .context/desktop-release/expected-assets.tsv
          asset_json="$(gh api "repos/${UPDATE_REPOSITORY}/releases/${RELEASE_ID}")"
          jq -r '.assets[] | [.name, (.size | tostring), .state] | @tsv' \
            <<< "$asset_json" \
            | sort > .context/desktop-release/uploaded-assets.tsv
          if ! cmp -s \
            .context/desktop-release/expected-assets.tsv \
            .context/desktop-release/uploaded-assets.tsv
          then
            echo "::error::Draft release assets have unexpected names, states, or byte sizes"
            diff -u \
              .context/desktop-release/expected-assets.tsv \
              .context/desktop-release/uploaded-assets.tsv || true
            exit 1
          fi

      - name: Publish the DMG and OTA update atomically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${UPDATE_REPOSITORY}/releases/${RELEASE_ID}")"
          if [[ "$(jq -r .draft <<< "$release_json")" != "true" ]]; then
            echo "::error::The release stopped being a draft before publication"
            exit 1
          fi
          if [[ "$(jq -r .tag_name <<< "$release_json")" != "$RELEASE_TAG" ]]; then
            echo "::error::The release draft tag changed before publication"
            exit 1
          fi
          if [[ "$(jq -r .prerelease <<< "$release_json")" != "false" ]]; then
            echo "::error::The release draft became a prerelease before publication"
            exit 1
          fi
          expected_title="$(bun scripts/release_notes.mjs title --version "$RELEASE_VERSION")"
          if [[ "$(jq -r .name <<< "$release_json")" != "$expected_title" ]]; then
            echo "::error::The release title changed before publication"
            exit 1
          fi
          jq -j .body <<< "$release_json" > .context/desktop-release/pre-publish-notes.md
          if ! cmp -s \
            .context/desktop-release/release-notes.md \
            .context/desktop-release/pre-publish-notes.md
          then
            echo "::error::The release notes changed before publication"
            exit 1
          fi
          jq -r '.assets[] | [.name, (.size | tostring), .state] | @tsv' \
            <<< "$release_json" \
            | sort > .context/desktop-release/pre-publish-assets.tsv
          if ! cmp -s \
            .context/desktop-release/expected-assets.tsv \
            .context/desktop-release/pre-publish-assets.tsv
          then
            echo "::error::The release assets changed before publication"
            exit 1
          fi
          tag_ref_json="$(gh api "repos/${UPDATE_REPOSITORY}/git/matching-refs/tags/${RELEASE_TAG}")"
          tag_ref_count="$(jq --arg ref "refs/tags/${RELEASE_TAG}" \
            '[.[] | select(.ref == $ref)] | length' <<< "$tag_ref_json")"
          if [[ "$tag_ref_count" -ne 1 ]]; then
            echo "::error::The exact ${RELEASE_TAG} ref is missing before publication"
            exit 1
          fi
          tag_commit_sha="$(gh api \
            "repos/${UPDATE_REPOSITORY}/commits/${RELEASE_TAG}" \
            --jq .sha)"
          if [[ "$tag_commit_sha" != "$SOURCE_SHA" ]]; then
            echo "::error::${RELEASE_TAG} moved away from the source SHA before publication"
            exit 1
          fi

          jq -n '{draft: false, prerelease: false, make_latest: "true"}' \
            | gh api \
                --method PATCH \
                "repos/${UPDATE_REPOSITORY}/releases/${RELEASE_ID}" \
                --input - \
                > .context/desktop-release/published.json
          release_json="$(gh api "repos/${UPDATE_REPOSITORY}/releases/${RELEASE_ID}")"
          if [[ "$(jq -r .draft <<< "$release_json")" != "false" ]]; then
            echo "::error::The verified release was not published"
            exit 1
          fi
          if [[ "$(jq -r .prerelease <<< "$release_json")" != "false" ]]; then
            echo "::error::The published release unexpectedly became a prerelease"
            exit 1
          fi
          expected_title="$(bun scripts/release_notes.mjs title --version "$RELEASE_VERSION")"
          if [[ "$(jq -r .name <<< "$release_json")" != "$expected_title" ]]; then
            echo "::error::The published release title changed"
            exit 1
          fi
          jq -j .body <<< "$release_json" > .context/desktop-release/published-notes.md
          if ! cmp -s \
            .context/desktop-release/release-notes.md \
            .context/desktop-release/published-notes.md
          then
            echo "::error::The published release notes changed"
            exit 1
          fi
          jq -r '.assets[] | [.name, (.size | tostring), .state] | @tsv' \
            <<< "$release_json" \
            | sort > .context/desktop-release/published-assets.tsv
          if ! cmp -s \
            .context/desktop-release/expected-assets.tsv \
            .context/desktop-release/published-assets.tsv
          then
            echo "::error::The published release asset set changed"
            exit 1
          fi
          tag_ref_json="$(gh api "repos/${UPDATE_REPOSITORY}/git/matching-refs/tags/${RELEASE_TAG}")"
          tag_ref_count="$(jq --arg ref "refs/tags/${RELEASE_TAG}" \
            '[.[] | select(.ref == $ref)] | length' <<< "$tag_ref_json")"
          if [[ "$tag_ref_count" -ne 1 ]]; then
            echo "::error::The published release tag ref is missing"
            exit 1
          fi
          tag_commit_sha="$(gh api \
            "repos/${UPDATE_REPOSITORY}/commits/${RELEASE_TAG}" \
            --jq .sha)"
          if [[ "$tag_commit_sha" != "$SOURCE_SHA" ]]; then
            echo "::error::The published release tag does not point to the source SHA"
            exit 1
          fi
          release_url="$(jq -r .html_url <<< "$release_json")"
          {
            echo "### Desktop release published"
            echo
            echo "- Release: [$RELEASE_TAG]($release_url)"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Assets: DMG, ZIP, blockmaps, latest-mac.yml, compatibility manifest"
          } >> "$GITHUB_STEP_SUMMARY"
