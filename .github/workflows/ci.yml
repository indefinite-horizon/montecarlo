# Chromium jobs use x64; all other jobs use ARM64.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  audit:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install
      - run: bun scripts/audit-critical.ts

  lint:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install
      - run: bun run lint

  typecheck:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install
      - run: bun run typecheck

  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install
      - run: bun run test
      - run: RUN_INTEGRATION_TESTS=1 bun run test

  build:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install
      - run: bun run build:web
      - run: bun run build:runtime
      - run: bun run --filter './apps/desktop' build:dir

  convex-codegen:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install
      - run: bash scripts/codegen_anon.sh .env.example
      - run: git diff --exit-code convex/_generated

  validate-i18n:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install
      - run: bun run validate:i18n

  e2e-core:
    # Convex, two Vite servers, and two Chromium workers run concurrently.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install
      - run: bunx playwright install --with-deps chromium
      - run: bash scripts/prepare_e2e_env.sh .env.example .env.e2e
      - run: bun run test:e2e:core:ci

  e2e-perf:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install
      - run: bunx playwright install --with-deps chromium
      - run: bash scripts/prepare_e2e_env.sh .env.example .env.e2e
      - run: PLAYWRIGHT_WORKERS=2 bun run test:e2e:perf:ci

  e2e-external:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install
      - run: bunx playwright install --with-deps chromium
      - run: bash scripts/prepare_e2e_env.sh .env.example .env.e2e
      - run: PLAYWRIGHT_WORKERS=2 bun run test:e2e:external:ci
